name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Show Go version
        run: go version
      - name: go test (non-race)
        run: go test ./...
      - name: go test (race)
        run: go test -race ./...
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
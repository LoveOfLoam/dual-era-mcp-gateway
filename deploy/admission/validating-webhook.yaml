# caBundle must be replaced with the base64 CA that signs mcp-admission-tls.
# This manifest is a skeleton; no cert-manager or secret is installed here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dual-era-mcp
webhooks:
  - name: mcpsource.gateway.dual-era.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: mcp-admission
        namespace: default
        path: /validate
        port: 443
      caBundle: REPLACE_ME
    rules:
      - apiGroups: ["gateway.dual-era.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mcpsources", "mcpconsumers"]
        scope: Namespaced
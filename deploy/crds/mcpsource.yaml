apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpsources.gateway.dual-era.io
spec:
  group: gateway.dual-era.io
  names:
    kind: McpSource
    listKind: McpSourceList
    plural: mcpsources
    singular: mcpsource
    shortNames: [mcpsrc]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  pattern: "^[a-z0-9-]{1,32}$"
                type:
                  type: string
                  enum: [mcp, rest]
                protocol:
                  type: string
                endpoint:
                  type: string
                baseURL:
                  type: string
                prefix:
                  type: string
                  pattern: "^[a-z0-9-]{1,32}$"
                allowedHosts:
                  type: array
                  items: {type: string}
                headers:
                  type: object
                  additionalProperties: {type: string}
                auth:
                  type: object
                  properties:
                    type: {type: string, enum: [oauth2, hmac]}
                    tokenURL: {type: string}
                    clientID: {type: string}
                    clientSecret: {type: string}
                    scopes:
                      type: array
                      items: {type: string}
                    secret: {type: string}
                    header: {type: string}
                tools:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      description: {type: string}
                      method: {type: string}
                      path: {type: string}
                      inputSchema:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
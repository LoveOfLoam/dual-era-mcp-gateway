apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpconsumers.gateway.dual-era.io
spec:
  group: gateway.dual-era.io
  names:
    kind: McpConsumer
    listKind: McpConsumerList
    plural: mcpconsumers
    singular: mcpconsumer
    shortNames: [mcpconsumer]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenant]
              properties:
                tenant:
                  type: string
                  pattern: "^[a-z0-9-]{1,32}$"
                name: {type: string}
                apiKeys:
                  type: array
                  items:
                    type: object
                    required: [name, sha256]
                    properties:
                      name: {type: string}
                      sha256:
                        type: string
                        pattern: "^[a-f0-9]{64}$"
                allow:
                  type: array
                  items:
                    type: object
                    properties:
                      source: {type: string}
                      tools:
                        type: array
                        items: {type: string}
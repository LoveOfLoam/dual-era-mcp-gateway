# Redis Sentinel overlay for the T8 HA experiment.
services:
  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6379", "--save", ""]
    expose: ["6379"]

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6379", "--replicaof", "redis-master", "6379"]
    expose: ["6379"]
    depends_on: [redis-master]

  redis-sentinel:
    image: redis:7-alpine
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    expose: ["26379"]
    depends_on: [redis-master, redis-replica]

  policy:
    command:
      ["-config", "/config/policy.example.json", "-authz-addr", ":19001",
       "-ratelimit-addr", ":19002", "-redis-sentinel", "redis-sentinel:26379",
       "-redis-master", "mymaster"]
    depends_on: [redis-master, redis-replica, redis-sentinel]
apiVersion: v1
kind: ConfigMap
metadata:
  name: dual-era-config
data:
  controlplane.json: |
    {"sources": {{ .Values.sources | toJson }}}
  policy.json: |
    {{ .Values.policy | toJson }}
  envoy-public.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
        - name: public
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: public
                    route_config:
                      name: public
                      virtual_hosts:
                        - name: public
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/modern/mcp"}
                              route: {cluster: modern_gateway}
                            - match: {prefix: "/mcp"}
                              route: {cluster: legacy_envoy}
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          grpc_service:
                            envoy_grpc: {cluster_name: policy_authz}
                            timeout: 0.5s
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: modern_gateway
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: modern_gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: dual-era-gateway, port_value: 8080}
        - name: legacy_envoy
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: legacy_envoy
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: dual-era-envoy-legacy, port_value: 10001}
        - name: policy_authz
          type: STRICT_DNS
          http2_protocol_options: {}
          connect_timeout: 1s
          load_assignment:
            cluster_name: policy_authz
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: dual-era-policy, port_value: 19001}
  envoy-legacy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9902}
    static_resources:
      listeners:
        - name: legacy_internal
          address:
            socket_address: {address: 0.0.0.0, port_value: 10001}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: legacy_internal
                    route_config:
                      name: legacy_route
                      virtual_hosts:
                        - name: legacy
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route: {cluster: mcp_multicluster}
                    http_filters:
                      - name: envoy.filters.http.mcp
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.mcp.v3.Mcp
                          traffic_mode: PASS_THROUGH
                      - name: envoy.filters.http.mcp_router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.mcp_router.v3.McpRouter
                          servers: []
      clusters:
        - name: mcp_multicluster
          connect_timeout: 0.25s
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.mcp_multicluster
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.mcp_multicluster.v3.ClusterConfig
              servers:
                - name: weather
                  mcp_cluster: {cluster: weather, path: /mcp}
                - name: crm
                  mcp_cluster: {cluster: crm, path: /mcp}
        - name: weather
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: weather
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: weather, port_value: 9001}
        - name: crm
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: crm
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: crm, port_value: 9002}